# ESPHome firmware for the WyBot DS20 dock's ESP32-C3-MINI-1.
#
# As written this is the CONNECTIVITY-ONLY image: WiFi + native API + ESPHome OTA, and it drives
# NO GPIO. That is deliberate: it is the known-good minimal image that proves the board joins WiFi,
# and a safe fallback. The functional image is wybot-dock-bridge.yaml (UART0 GPIO21/GPIO20, 115200).
# This file was used before the C3<->MCU pins were confirmed, so the first custom image could not
# risk driving a pin onto an unknown net on the no-rollback stock bootloader. The pins are now known
# (see wybot-dock-bridge.yaml and docs/protocol-confirmed.md); the stage-2 block at the bottom is
# kept as a minimal reference for wiring the bridge onto this skeleton.
#
# Pushed onto the dock the first time via WyBot's own (unsigned, md5-only) OTA channel. Because the
# stock bootloader has no secure boot and no app-rollback, this first image MUST be known-good:
# flash this exact binary to a spare ESP32-C3-MINI-1 over USB and confirm it boots + joins WiFi
# BEFORE OTA-pushing it to the dock.

esphome:
  name: wybot-dock
  friendly_name: WyBot Dock

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1   # ESP32-C3-MINI-1, 4MB
  framework:
    type: esp-idf            # match the stock stack; best control on C3

# --- connectivity ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32-C3 "Super Mini" clones brown out / distort TX at the default 20dBm on their cheap PCB
  # antenna, which corrupts the WPA2 handshake (symptom: repeated reason='Auth Expired'). 8.5dB is
  # the known-good value for the bench board. Safe for the real dock too: at full stock power it
  # reports -44 dBm / 51 dB SNR / 86% to the AP, so -11.5 dB still
  # lands ~-55 dBm, ~23 dB above the -67 dBm line. Raise toward 15dB only if a future check shows it
  # weak; output_power can't be changed over the air if the dock never associates.
  output_power: 8.5dB
  ap:
    ssid: "WyBot-Dock Setup"
    password: !secret fallback_ap_password

captive_portal:

# --- management ---
logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# --- liveness ---
sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

# ===========================================================================================
# To turn this skeleton into the functional bridge, add the confirmed UART + the wybot_bridge
# component. The complete, maintained version of this (all DP sensors, the select/button controls
# and the cleaning detector) is esphome/wybot-dock-bridge.yaml -- prefer running that directly.
# Minimal form:
#
# external_components:
#   - source: { type: local, path: components }   # or: github://bassrock/wybot-s2-decloud@main
#     components: [ wybot_bridge ]
#
# uart:
#   id: mcu
#   tx_pin: GPIO21        # C3 -> MCU (confirmed)
#   rx_pin: GPIO20        # C3 <- MCU (confirmed)
#   baud_rate: 115200
#
# wybot_bridge:
#   id: bridge
#   uart_id: mcu
#   cleaning:
#     name: "Cleaning"
# ===========================================================================================
