# ESPHome firmware for the WyBot DS20 dock's ESP32-C3-MINI-1.
#
# As written this is the CONNECTIVITY-ONLY image: WiFi + native API + ESPHome OTA, and it drives
# NO GPIO. That is deliberate. The dock's C3<->GD32 UART pins are not known yet, and the stock
# OTA path has no rollback, so the first custom image must not route/drive any pin onto an unknown
# net. Discover the pins first with wybot-dock-pinscan.yaml, then uncomment + fill the `uart:` /
# `wybot_bridge:` / API-action blocks at the bottom with the real tx/rx/baud to make the functional
# image, and OTA that.
#
# Pushed onto the dock the first time via WyBot's own (unsigned, md5-only) OTA channel. Because the
# stock bootloader has no secure boot and no app-rollback, this first image MUST be known-good:
# flash this exact binary to a spare ESP32-C3-MINI-1 over USB and confirm it boots + joins WiFi
# BEFORE OTA-pushing it to the dock.

esphome:
  name: wybot-dock
  friendly_name: WyBot Dock

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1   # ESP32-C3-MINI-1, 4MB
  framework:
    type: esp-idf            # match the stock stack; best control on C3

# --- connectivity ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32-C3 "Super Mini" clones brown out / distort TX at the default 20dBm on their cheap PCB
  # antenna, which corrupts the WPA2 handshake (symptom: repeated reason='Auth Expired'). 8.5dB is
  # the known-good value for the bench board. The real dock is a genuine C3-MINI-1 in a housing by
  # the pool: check its RSSI in UniFi and RAISE this (~15dB) before relying on it, since output_power
  # can't be changed over the air if the dock never associates.
  output_power: 8.5dB
  ap:
    ssid: "WyBot-Dock Setup"
    password: !secret fallback_ap_password

captive_portal:

# --- management ---
logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# --- liveness ---
sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

